# Per-project config for the vendored agent-harness hook scripts
# (scripts/hooks/*.py). Those scripts are byte-identical across every project;
# everything project-specific lives here. Loaded by scripts/hooks/harness_config.py.
# Schema + neutral defaults: that module's dataclasses.
#
# Generated by devkit's `new-project.py`. This file is deliberately NOT in
# sync-devkit.py's MANIFEST — it is the per-project seam, so editing it here is
# correct and will never be reported as drift.

[project]
# Prefix for the harness control env vars:
#   TVSHELL_SKIP_STOP_VERIFY, TVSHELL_STOP_TESTS_AUTOSTART
env_prefix = "TVSHELL"

[paths]
app = "tvshell/"
tests = "tests/"
unit_tests = "tests"

# The interpreter this project is pinned to — the same version `pyproject.toml`'s
# `requires-python`, mypy and ruff's `target-version` carry. A lockfile pins the
# packages but never the interpreter, so `worktree.py provision` built an ephemeral
# box's .venv from whatever Python happened to run it — the workstation default,
# which is a newer release than this on most machines. Keep this in step when you
# move the version elsewhere.
[python]
version = "3.12"

# How a finished session's work reaches the default branch. `gated`, the default, is a
# PR the gate decides. `direct` merges first: the ship task opens a PR labelled
# `merge-now`, nothing waits on a gate, and every check runs after the merge and repairs
# what it finds.
#
# [delivery]
# flow = "direct"

# The Bash output cap `invoke-capped.py` applies. `enforce-capped-bash.py` (vendored,
# not wired as a hook) quotes the same `max_bytes`, so one field feeds both.
#
# `head_bytes` is the share of the cap given to the START of the output; the rest
# goes to the tail. Both windows are kept because the useful parts of a long
# command's output are the first lines (what ran) and the last (how it failed).
[bash]
max_bytes = 4000
head_bytes = 2000

# Which of this project's code the untested-symbol ratchet scans
# (`scripts/hooks/untested_symbols.py`; the gaps it finds are recorded in
# `.devkit-untested.txt`, which is committed and may only shrink).
#
# Both fields are path prefixes and both are optional. `sources` defaults to the app
# tree plus `scripts/` -- name it only if this project keeps code somewhere else, since
# a gate covering half a repo is worse than one covering all of it. `exclude` is for
# subtrees the project does not answer for: a generated client, a vendored library.
#[test_contract]
#sources = ["tvshell/", "scripts/", "lib/"]
#exclude = ["tvshell/generated/"]

# The structural ratchet (`scripts/hooks/structure_check.py`): file, function, class
# and component size, complexity, nesting, parameter and import counts, import cycles,
# orphan modules, suppression and skipped-test counts, declared dependencies, and the
# import and call-site boundaries declared below. Findings are recorded in
# `.devkit-structure.txt`, which is committed and may only shrink; the limits below
# are the script's `DEFAULT_LIMITS` and are shown so a project can see what it holds
# to. Every key is optional; an unknown limit or rule name is a configuration error.
#[structure]
#paths = ["tvshell/", "scripts/"]       # defaults to the app tree, scripts/ and the frontend src
#exclude = ["tvshell/migrations/"]      # generated code the project does not answer for
#entrypoints = ["tvshell/plugins/"]     # loaded by name, so the orphan rule must not see them
#disabled = []                               # e.g. ["orphan"] for a library whose modules are its API
#
#[structure.limits]
#file_lines = 500
#function_lines = 80
#function_params = 6
#complexity = 15
#nesting_depth = 4
#class_lines = 300
#class_methods = 20
#imports = 20
#definitions = 20
#component_lines = 250
#react_state = 8
#react_effects = 5
#
# Import boundaries: files under `from` may not import anything `forbid` names, as a
# module prefix (`sqlalchemy`) or a path prefix of the resolved file (`tvshell/db/`).
#[[structure.layers]]
#name = "routes-do-not-touch-the-db"
#from = ["tvshell/api/"]
#forbid = ["tvshell/db/", "sqlalchemy"]
#
# Call-site boundaries: `pattern` (a regex) may appear only under `only_in`; `paths`
# narrows which files are checked at all.
#[[structure.restrict]]
#name = "browser-storage-through-the-wrapper"
#pattern = "\\b(localStorage|sessionStorage)\\b"
#only_in = ["frontend/src/lib/storage"]
#
#[[structure.restrict]]
#name = "http-through-the-api-client"
#pattern = "\\bfetch\\("
#paths = ["frontend/src/"]
#only_in = ["frontend/src/api/"]
#
#[[structure.restrict]]
#name = "sql-in-the-repository-layer"
#pattern = "\\.execute\\("
#paths = ["tvshell/"]
#only_in = ["tvshell/repositories/"]

# No DB tier: the gate runs lint + the script tests only. Turn this on by
# setting `enabled = true` under a [db] table once a compose DB service exists.
[db]
enabled = false

[frontend]
enabled = false

[desktop]
enabled = false

# In a `[delivery]` table, `medium_tier` names the command the medium test tier runs at a
# commit in place of `scripts/run-tests.py --all`; it is how a project with a database opts in.
